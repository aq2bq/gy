[workspace]
members = ["crates/gy", "crates/gy-ledger", "crates/gy-serve"]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/aq2bq/gy"
homepage = "https://github.com/aq2bq/gy"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
