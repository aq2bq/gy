<!doctype html>
<html lang="%LANG%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gy serve</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/now.css">
<link rel="stylesheet" href="/assets/list.css">
<link rel="stylesheet" href="/assets/node.css">
<link rel="stylesheet" href="/assets/palette.css">
<link rel="stylesheet" href="/assets/graph.css">
<link rel="stylesheet" href="/assets/time.css">
</head>
<body>
<div class="app">
<aside class="side">
  <a class="wordmark" href="#/">gy</a>
  <nav class="nav" id="nav"></nav>
  <div class="foot">
    <div class="lang" id="lang"><button data-l="en">EN</button><button data-l="ja">日本語</button></div>
    <div class="live-line" id="clock"></div>
  </div>
</aside>
<div>
  <div class="topbar"><div class="crumb" id="crumb"></div><div class="search" id="searchbtn" style="margin-left:auto"><span id="searchlbl"></span><kbd>⌘K</kbd></div></div>
  <main id="main"></main>
</div>
</div>
<div class="pal" id="pal"><div class="box">
  <input id="palq" autocomplete="off">
  <div class="res" id="palres"></div>
  <div class="hint" id="palhint"></div>
</div></div>
<script src="/assets/shell.js"></script>
<script src="/assets/now.js"></script>
<script src="/assets/list.js"></script>
<script src="/assets/node.js"></script>
<div class="scrub">
  <div class="bar">
    <span class="lbl"><span id="t-rewind"></span> <b id="scrub-at"></b></span>
    <span class="lbl" id="scrub-seq"></span>
    <button class="now" id="scrub-now"></button>
  </div>
  <div class="track" id="track"><svg id="ticks"></svg><div class="shade" id="shade"></div><div class="head" id="head"></div></div>
</div>
<script src="/assets/palette.js"></script>
<script src="/assets/time.js"></script>
<script src="/assets/graph-draw.js"></script>
<script src="/assets/graph.js"></script>
<script src="/assets/live.js"></script>
</body>
</html>
