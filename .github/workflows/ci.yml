name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo install gy --version 3.0.0 --locked --root "$GY_COMPAT_ROOT"
        env:
          GY_COMPAT_ROOT: ${{ runner.temp }}/gy-3.0.0
      - run: GY_COMPAT_BIN="$GY_COMPAT_ROOT/bin/gy" cargo test -p gy --test remote_subject_compat --locked -- --ignored
        env:
          GY_COMPAT_ROOT: ${{ runner.temp }}/gy-3.0.0
      - run: GY_COMPAT_BIN="$GY_COMPAT_ROOT/bin/gy" cargo test -p gy --test narrows_compat --locked -- --ignored
        env:
          GY_COMPAT_ROOT: ${{ runner.temp }}/gy-3.0.0
      - run: cargo install --path crates/gy --locked --root install-check

  tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: cargo-shear
            version: 1.14.0
            check: cargo shear
          - tool: knots
            version: 1.18.0
            check: knots --recursive crates --exclude-path 'tests/' --cognitive-threshold 15 --baseline knots-baseline.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: tool-cache
        with:
          path: .ci-tools
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.tool }}-${{ matrix.version }}
      - if: steps.tool-cache.outputs.cache-hit != 'true'
        run: cargo install --locked ${{ matrix.tool }}@${{ matrix.version }} --root .ci-tools
      - run: echo "$GITHUB_WORKSPACE/.ci-tools/bin" >> "$GITHUB_PATH"
      - run: ${{ matrix.check }}

  # Preserve the test status: success includes both tools and Rust.
  test:
    if: always()
    needs: [rust, tools]
    runs-on: ubuntu-latest
    steps:
      - run: test "$RUST_RESULT" = success && test "$TOOLS_RESULT" = success
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          TOOLS_RESULT: ${{ needs.tools.result }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-release
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: ./without-node.sh bun install --frozen-lockfile
        working-directory: e2e
      - name: Inspect yuku backend
        working-directory: e2e
        run: |
          ./without-node.sh bun -e '
            const loaded = [];
            const dlopen = process.dlopen;
            process.dlopen = function (...args) {
              const result = dlopen.apply(this, args);
              loaded.push(String(args[1]));
              return result;
            };
            let wasmModules = 0;
            WebAssembly.Module = new Proxy(WebAssembly.Module, {
              construct(target, args) { wasmModules++; return Reflect.construct(target, args); }
            });
            const { parse } = await import("yuku");
            parse("let value = 1; value;", { analyze: true });
            console.log(JSON.stringify({ platform: process.platform, arch: process.arch, loaded, wasmModules }));
            if (!loaded.length && !wasmModules) throw new Error("No parser backend observed");
          '
      - run: ./without-node.sh bun run test:unit
        working-directory: e2e
      - run: cargo build --release -p gy --bin gy --example large_fixture --locked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/bun.lock') }}
      - run: ./without-node.sh bunx --bun playwright install --with-deps chromium
        working-directory: e2e
      - run: ./without-node.sh bunx --bun playwright test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
