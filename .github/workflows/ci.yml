name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # cargo-mutants reads the diff since the pushed-from commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo install --path crates/gy --locked --root install-check
      - name: Unused dependencies (cargo-shear)
        run: |
          cargo install --locked cargo-shear@1.14.0
          cargo shear
      - name: Cognitive complexity against the baseline (knots)
        run: |
          cargo install --locked knots@1.18.0
          knots --recursive crates --exclude-path 'tests/' --cognitive-threshold 15 --baseline knots-baseline.json
      - name: Mutation testing on the pushed diff (cargo-mutants)
        run: |
          cargo install --locked cargo-mutants@27.1.0
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD~1
          fi
          git diff "$BASE" > "$RUNNER_TEMP/mutants.diff"
          cargo mutants --in-diff "$RUNNER_TEMP/mutants.diff"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p gy --locked
      - run: npm ci --prefix e2e
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx --prefix e2e playwright install --with-deps chromium
      - run: npm test --prefix e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
